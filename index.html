const row=(k,v,max)=>{const p=Math.max(0,Math.min(100,v/max*100));return `<tr><td>${t(k)}</td><td><div class="bar"><div style="width:${p}%"></div></div></td><td>${v}</td></tr>`;};
const rec=s<35?t('recLo'):s<70?t('recMi'):t('recHi');
document.getElementById('meterOut').innerHTML=`<div class="gauge"><div class="score ${cls}">${s}</div><div><b>${s}/100</b><br><small style="color:var(--mut)">${a.nT} ids · ${a.chars} chars</small></div></div><table class="pt">${row('kId',a.entropy.toFixed(2),0.6)}${row('kEsc',a.escN,15)}${row('kEval',a.evalN,2)}${row('kOx',a.oxU,6)}${row('kArr',a.arrP,2)}${row('kMin',a.minScore.toFixed(2),0.85)}${row('kCmt',a.cmt.toFixed(2),0.15)}${row('kLine',a.longL.toFixed(2),0.3)}</table><div class="note">${rec}</div>`;
}
function loadPlain(){document.getElementById('srcIn').value=SAMPLE_PLAIN;}
function loadObf(){document.getElementById('srcIn').value=SAMPLE_OBF;}
function swapStrings(src,fn){
return src.replace(/('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`)/g,m=>fn(m));
}
function runDeob(){
let src=getSrc();if(!src.trim()){toast(t('needCode'));return;}
const log=[];
if(document.getElementById('dUnesc').checked){
const n=(src.match(/\\x[0-9a-fA-F]{2}|\\u[0-9a-fA-F]{4}/g)||[]).length;
src=swapStrings(src,m=>m.replace(/\\x([0-9a-fA-F]{2})/g,(x,h)=>String.fromCharCode(parseInt(h,16))).replace(/\\u([0-9a-fA-F]{4})/g,(x,h)=>String.fromCharCode(parseInt(h,16))));
log.push('unesc:'+n);}
if(document.getElementById('dB64').checked){
const toks=src.match(/['"`][A-Za-z0-9+/]{24,}={0,2}['"`]/g)||[];
let shown=0;
toks.slice(0,12).forEach(tk=>{const raw=tk.slice(1,-1);try{const d=atob(raw);if(/^[\x20-\x7E\s]{4,}$/.test(d)&&d.length<400){log.push('b64:'+raw.slice(0,26)+'… → '+d.slice(0,80));shown++;}}catch(e){}});
if(!shown)log.push('b64:0');}
if(document.getElementById('dArr').checked){
const am=src.match(/var\s+(_0x\w*)\s*=\s*\[([\s\S]{0,4000}?)\];/);
if(am){const nm=am[1],body=am[2];
const els=body.split(/,(?=(?:[^'"]|'[^']*'|"[^"]*")*$)/).map(e=>e.trim()).filter(e=>/^['"]/.test(e));
const map=els.map((e,i)=>`${nm}[${i}]/${nm}[0x${i.toString(16)}] → ${e.slice(0,60)}`);
src=src.replace(new RegExp(nm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+ '\\[(0x[0-9a-fA-F]+|\\d+)\\]','g'),(m,ix)=>{const i=ix.startsWith('0x')?parseInt(ix,16):+ix;return (els[i]!==undefined)?els[i]:m;});
log.push('arr:'+els.length+' | '+map.slice(0,10).join(' | '));}
else log.push('arr:0');}
if(document.getElementById('dPretty').checked){
const store=[];src=src.replace(/('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`)/g,m=>{store.push(m);return '@@S'+(store.length-1)+'@@';});
src=src.replace(/;/g,';\n').replace(/\{/g,'{\n').replace(/\}/g,'\n}\n');
let ind=0;src=src.split('\n').map(l=>{l=l.trim();if(!l)return '';if(l[0]==='}')ind=Math.max(0,ind-1);const r='  '.repeat(ind)+l;if(l.endsWith('{'))ind++;return r;}).join('\n');
src=src.replace(/@@S(\d+)@@/g,(m,i)=>store[+i]!==undefined?store[+i]:m);}
document.getElementById('deobOut').textContent=(log.length?log.join('\n---\n')+'\n---\n':'')+src;
}
function runProtect(){
let src=getSrc();if(!src.trim()){toast(t('needCode'));return;}
const before=src.length;
if(document.getElementById('pStrip').checked){
const store=[];src=src.replace(/('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`)/g,m=>{store.push(m);return '@@S'+(store.length-1)+'@@';});
src=src.replace(/\/\/[^\n]*/g,'').replace(/\/\*[\s\S]*?\*\//g,'');
src=src.replace(/@@S(\d+)@@/g,(m,i)=>store[+i]);}
if(document.getElementById('pMin').checked){src=src.replace(/\s+/g,' ').replace(/\s*([;{},()\[\]=+\-*/<>!&|:?])\s*/g,'$1').trim();}
if(document.getElementById('pHex').checked){
src=src.replace(/('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*")/g,m=>{const q=m[0],inner=m.slice(1,-1);
if(inner.length>200||/\\/.test(inner))return m;
let h='';for(const ch of inner)h+='\\x'+ch.charCodeAt(0).toString(16).padStart(2,'0');
return q+h+q;});}
if(document.getElementById('pArr').checked){
const store=[];const re=/('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*")/g;let m;
while((m=re.exec(src))!==null){const s=m[0];if(s.length>3&&s.length<80&&store.indexOf(s)<0)store.push(s);}
if(store.length>1){const nm='_0x'+Math.floor(Math.random()*0xffffff).toString(16);
store.forEach(s=>{src=src.split(s).join(nm+'['+store.indexOf(s)+']');});
src='var '+nm+'=['+store.join(',')+'];\n'+src;}}
const after=src.length;
document.getElementById('protOut').textContent=`/* ${before} → ${after} chars (${Math.round((1-after/Math.max(1,before))*100)}%) */\n`+src;
window._prot=src;
}
function dlProt(){const s=window._prot||document.getElementById('protOut').textContent;if(!s.trim())return;const b=new Blob([s],{type:'text/javascript'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='protected.js';a.click();toast(t('dlDone'));}
function snip(k){
let s='';
if(k==='domain')s=`// Domain lock — aborts on foreign hosts\n(function(){var ok=['yourdomain.com','www.yourdomain.com'];if(ok.indexOf(location.hostname)<0){document.body.innerHTML='';throw new Error('domain');}})();`;
if(k==='debug')s=`// DevTools trap (demo) — slows casual debugging\nsetInterval(function(){var t=Date.now();debugger;if(Date.now()-t>100){/* paused */}},4000);`;
if(k==='copy')s=`// Copy-guard\n['copy','cut','contextmenu'].forEach(function(e){document.addEventListener(e,function(ev){ev.preventDefault();});});`;
document.getElementById('snipOut').textContent=s;
}

if(A.client){el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';
if(!document.querySelector('script[src*="adsbygoogle"]')){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+A.client;s.crossOrigin='anonymous';document.head.appendChild(s);}try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
else if(A.carbonServe){el.innerHTML='';const s=document.createElement('script');s.async=true;s.id='_carbonads_js';s.src='//cdn.carbonads.com/carbon.js?serve='+A.carbonServe+'&placement='+A.carbonPlacement;el.appendChild(s);}}
setLang('en');loadAds();renderDonate();
